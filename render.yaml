# Render Blueprint: adept& Backend
# Deploy: render.com → New → Blueprint → dieses Repo + Branch 'adept-main'.
# Die secret-Variablen (sync: false) werden beim ersten Deploy im Render-UI
# abgefragt und sind dort zu hinterlegen.
services:
  - type: web
    name: adept-backend
    runtime: docker
    plan: starter
    # WICHTIG – Region Frankfurt (EU):
    # 1. Plentymarkets (deutscher Anbieter) hat Verbindungen aus der früheren
    #    US-Region (Oregon) auf Netzwerkebene abgewiesen (ECONNRESET, noch vor
    #    jeder Anmeldung; Gegenprobe example.com aus derselben Umgebung: 200).
    # 2. Es werden Kundendaten deutscher Firmen verarbeitet – die gehören in
    #    ein EU-Rechenzentrum.
    # Die Region lässt sich bei einem bestehenden Service NICHT ändern; ein
    # Wechsel erfordert einen neuen Service (+ neue Datenbank in derselben
    # Region, sonst ist keine private Netzwerkverbindung möglich).
    region: frankfurt
    dockerfilePath: ./Dockerfile
    branch: adept-main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,app://localhost
      - key: JWT_ACCESS_EXPIRY
        value: 1h
      - key: JWT_REFRESH_EXPIRY
        value: 30d
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # Schlüssel für die Mandanten-Provisionierung (POST /platform/tenants).
      # Nicht gesetzt = Endpunkt deaktiviert (fail-closed).
      - key: PLATFORM_ADMIN_KEY
        sync: false
