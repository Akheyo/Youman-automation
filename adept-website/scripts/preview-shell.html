<title>adept& Deutschland</title>
<style>
  /* Bewusst einthemig: eine Vorschau braucht eine konstante dunkle Rahmung,
     damit die weiße Seite darin immer gleich beurteilt wird. Alle Farben
     sind explizit gesetzt, die Hülle hält auf hellem wie dunklem Host. */
  :root {
    --bg: #0b1620;
    --panel: #142430;
    --line: #223642;
    --fg: #e9f0f4;
    --muted: #8ba0ae;
    --accent: #7cc4ec;
    --radius: 6px;
    --bar-h: 52px;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--ui);
    font-size: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .bar {
    flex: none;
    height: var(--bar-h);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }

  .brand {
    font-weight: 650;
    letter-spacing: -0.01em;
    color: var(--fg);
    padding-right: 4px;
    flex: none;
  }

  button, select {
    font: inherit;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 7px 10px;
    min-height: 34px;
    cursor: pointer;
    transition: border-color 120ms, background-color 120ms, color 120ms;
  }

  button:hover, select:hover { border-color: var(--muted); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  select {
    max-width: 340px;
    /* eigene Optionsliste dunkel halten */
    background: var(--panel);
  }

  option { background: var(--panel); color: var(--fg); }
  optgroup { background: var(--panel); color: var(--muted); }

  .icon-btn {
    flex: none;
    width: 34px;
    padding: 0;
    display: grid;
    place-items: center;
    line-height: 1;
  }

  .icon-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .icon-btn svg { width: 16px; height: 16px; display: block; }

  .path {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex: 1;
  }

  .widths {
    flex: none;
    display: flex;
    gap: 4px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 3px;
  }

  .widths button {
    border: 0;
    border-radius: 4px;
    padding: 5px 9px;
    min-height: 28px;
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  .widths button:hover { background: #1c303d; color: var(--fg); }

  .widths button[aria-pressed="true"] {
    background: var(--accent);
    color: #06131c;
    font-weight: 600;
  }

  .stage {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
    padding: 14px;
  }

  .frame {
    width: 100%;
    height: 100%;
    max-width: 100%;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgb(0 0 0 / 0.45);
  }

  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  @media (max-width: 720px) {
    .brand, .widths { display: none; }
    .path { font-size: 11.5px; }
    .stage { padding: 0; }
    .frame { border: 0; border-radius: 0; box-shadow: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }
</style>

<div class="bar">
  <span class="brand">adept&amp;</span>

  <button class="icon-btn" id="back" aria-label="Zurück" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 18l-6-6 6-6" />
    </svg>
  </button>

  <label class="sr-only" for="page" hidden>Seite</label>
  <select id="page" aria-label="Seite auswählen"></select>

  <span class="path" id="path">/</span>

  <div class="widths" role="group" aria-label="Ansichtsbreite">
    <button data-w="375" aria-pressed="false">375</button>
    <button data-w="768" aria-pressed="false">768</button>
    <button data-w="1024" aria-pressed="false">1024</button>
    <button data-w="0" aria-pressed="true">Voll</button>
  </div>
</div>

<div class="stage">
  <div class="frame" id="frame">
    <iframe id="view" title="Seitenvorschau adept&amp;"></iframe>
  </div>
</div>

<script>
  const DATA = /*__PAYLOAD__*/;

  const view = document.getElementById('view');
  const frame = document.getElementById('frame');
  const select = document.getElementById('page');
  const pathEl = document.getElementById('path');
  const backBtn = document.getElementById('back');

  const routes = Object.keys(DATA.pages).sort();
  const history = [];

  // Lesbare Bezeichnung aus dem Slug ableiten.
  const NAMES = {
    '/': 'Startseite',
    '/404': '404 – Seite nicht gefunden',
    '/branchen': 'Branchen – Übersicht',
    '/funktionen': 'Funktionen – Übersicht',
    '/news': 'News – Übersicht',
    '/ueber-uns': 'Über uns',
    '/kontakt': 'Kontakt',
    '/news/drahtmueller-palettenoptimierung': 'Case Study Drahtmüller',
    '/impressum': 'Impressum',
    '/datenschutz': 'Datenschutzerklärung',
  };

  const label = (route) => {
    if (NAMES[route]) return NAMES[route];
    const slug = route.split('/').pop() || '';
    return slug
      .replace(/-und-/g, ' & ')
      .replace(/-/g, ' ')
      .replace(/\bueber\b/g, 'über')
      .replace(/\bkonsumgueter\b/g, 'Konsumgüter')
      .replace(/\bdrahtmueller\b/g, 'Drahtmüller')
      .replace(/^./, (c) => c.toUpperCase());
  };

  // Gruppierung spiegelt die Informationsarchitektur der Seite.
  const GROUPS = [
    ['Startseite', (r) => r === '/'],
    ['Branchen', (r) => r.startsWith('/branchen')],
    ['Funktionen', (r) => r.startsWith('/funktionen')],
    ['News', (r) => r.startsWith('/news')],
    ['Unternehmen', (r) => ['/ueber-uns', '/kontakt'].includes(r)],
    ['Rechtliches', (r) => ['/impressum', '/datenschutz', '/404'].includes(r)],
  ];

  for (const [name, test] of GROUPS) {
    const hits = routes.filter(test);
    if (!hits.length) continue;
    const group = document.createElement('optgroup');
    group.label = name;
    for (const route of hits) {
      const opt = document.createElement('option');
      opt.value = route;
      opt.textContent = label(route);
      group.appendChild(opt);
    }
    select.appendChild(group);
  }

  // In die Seite injiziert: fängt interne Links ab und meldet sie der Hülle.
  const bridge = (hash) => `
    <script>
      (function () {
        var target = ${JSON.stringify(hash || '')};
        if (target) {
          addEventListener('DOMContentLoaded', function () {
            var el = document.getElementById(target);
            if (el) el.scrollIntoView();
          });
        }
        document.addEventListener('click', function (e) {
          var a = e.target && e.target.closest && e.target.closest('a[href]');
          if (!a) return;
          var href = a.getAttribute('href');
          if (!href || href.charAt(0) === '#') return;
          e.preventDefault();
          if (/^(https?:|mailto:|tel:)/.test(href)) return;
          parent.postMessage({ type: 'nav', href: href }, '*');
        });
      })();
    <\/script>`;

  let current = null;

  function show(route, hash, record = true) {
    const page = DATA.pages[route];
    if (!page) return;
    if (record && current) history.push(current);
    current = { route, hash };

    view.srcdoc = page
      .replace('<!--CSS-->', '<style>' + DATA.css + '</style>')
      .replace('</body>', bridge(hash) + '</body>');

    select.value = route;
    pathEl.textContent = route + (hash ? '#' + hash : '');
    backBtn.disabled = history.length === 0;
  }

  addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'nav') return;
    const [path, hash] = String(e.data.href).split('#');
    const route = (path.replace(/\/+$/, '') || '/');
    show(DATA.pages[route] ? route : '/404', hash);
  });

  select.addEventListener('change', () => show(select.value));

  backBtn.addEventListener('click', () => {
    const prev = history.pop();
    if (prev) show(prev.route, prev.hash, false);
  });

  for (const button of document.querySelectorAll('.widths button')) {
    button.addEventListener('click', () => {
      const w = Number(button.dataset.w);
      frame.style.maxWidth = w ? w + 'px' : '100%';
      for (const other of document.querySelectorAll('.widths button')) {
        other.setAttribute('aria-pressed', String(other === button));
      }
    });
  }

  show('/');
</script>
