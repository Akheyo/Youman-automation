services:
  db:
    image: postgres:16-alpine
    container_name: kk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-komplett_konzept}
      POSTGRES_USER: ${POSTGRES_USER:-kk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kk} -d ${POSTGRES_DB:-komplett_konzept}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [kk]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kk-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-komplett_konzept}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt in .env}
      APP_URL: ${APP_URL:-http://localhost}
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      db:
        condition: service_healthy
    networks: [kk]

  caddy:
    image: caddy:2-alpine
    container_name: kk-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    networks: [kk]

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  kk:
    driver: bridge
