zugangTab = Zugang
dateiTab = Importdatei
preisTab = Preis
inseratTab = Inserat

tokenLabel = Token der Abholadresse
tokenTooltip = Das Geheimnis in der Adresse, die im Maschinensucher-Konto hinterlegt wird. Mindestens 16 Zeichen. Wer die Adresse hat, sieht unseren markierten Bestand samt Preisen — wie ein Passwort behandeln. Ein neues Token macht jede alte Adresse sofort wertlos.
flagIdLabel = ID der Markierung
flagIdTooltip = Die Markierung am Artikel, die ihn auf den Marktplatz stellt (Einrichtung, Artikel, Markierungen). Voreingestellt ist 27 fuer "Maschinensucher".
flagFeldLabel = Markierungsfeld
flagFeldTooltip = Die beiden Markierungsfelder sind getrennte Listen: Die 27 in Feld 2 ist eine ANDERE Markierung als die 27 in Feld 1. Deshalb wird nur das eingestellte Feld gelesen.
flagEins = Markierung 1
flagZwei = Markierung 2
flagBeide = Markierung 1 oder 2

kopfzeileLabel = Kopfzeile der Beispieldatei
kopfzeileTooltip = Die Kopfzeile aus der offiziellen Beispieldatei im Maschinensucher-Konto, unveraendert eingefuegt. Sie ist die einzige verbindliche Quelle fuer die Spaltenreihenfolge. Bleibt das Feld leer, geht unsere Standardreihenfolge raus — und die ist eine Annahme.
trennerLabel = Trennzeichen
trennerTooltip = Ein Zeichen, oder das Wort "tab" fuer einen Tabulator.
kodierungLabel = Zeichensatz
umbruecheLabel = Zeilenumbrueche im Text
umbruecheTooltip = Ein Importer, der die Datei erst in Zeilen und dann in Spalten schneidet, zerlegt an einem Umbruch im Beschreibungstext den halben Katalog. Deshalb werden Umbrueche standardmaessig zu Leerzeichen.
umbruecheEntfernen = zu Leerzeichen machen (empfohlen)
umbruecheBehalten = behalten

preisIstLabel = Preise in Plenty sind
preisIstTooltip = Auf einem Haendlermarktplatz wird netto ausgezeichnet. Steht in Plenty brutto, wird mit dem Steuersatz heruntergerechnet.
preisBrutto = brutto (inkl. MwSt.)
preisNetto = netto
mwstLabel = Steuersatz in Prozent
mwstTooltip = Nur fuer die Umrechnung brutto zu netto.
preislisteLabel = Preisliste (ID)
preislisteTooltip = Leer = die kleinste vorhandene ID, in Plenty ueblicherweise die Hauptpreisliste. Ist die eingestellte Liste an einem Artikel nicht gefuehrt, bekommt er KEINEN Preis und faellt aus der Datei — lieber kein Inserat als eines mit dem Preis einer fremden Liste.
waehrungLabel = Waehrung

kategorieLabel = Auffangkategorie
kategorieTooltip = Die Maschinensucher-Rubrik, wenn keine Zuordnung greift. Ohne Rubrik nimmt Maschinensucher kein Inserat an.
kategorieZuordnungLabel = Rubrik-Zuordnung
kategorieZuordnungTooltip = Suchwort=Rubrik, kommagetrennt, erster Treffer gewinnt. Gesucht wird in Titel, Hersteller und Modell. Beispiel: drehmaschine=1234,kompressor=77
praefixLabel = Vorsatz der Inseratsnummer
praefixTooltip = Traegt die Variantennummer den Vorsatz schon, wird er nicht doppelt gesetzt. Aendern heisst: alle Inserate gelten als neu.
landLabel = Land
plzLabel = PLZ
ortLabel = Ort
ansprechpartnerLabel = Ansprechpartner
telefonLabel = Telefon
emailLabel = E-Mail
emailTooltip = Das Postfach, in dem Anfragen zu den Inseraten ankommen.
shopLabel = Shop-Adresse
shopTooltip = Fuer den Link am Inserat, z. B. https://shop.example.de. Leer = kein Link.

freigabeLabel = Rueckgang freigeben
freigabeTooltip = Nur ankreuzen, wenn ein zurueckgehaltener Rueckgang gewollt war (z. B. es wurde wirklich fast alles verkauft). Der naechste Lauf schreibt die kleinere Datei und die Freigabe laeuft nach zwoelf Stunden von selbst ab.
