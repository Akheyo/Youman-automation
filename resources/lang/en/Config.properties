zugangTab = Access
dateiTab = Import file
preisTab = Price
inseratTab = Listing

tokenLabel = Token for the pickup URL
tokenTooltip = The secret in the URL stored in the Machineseeker account. At least 16 characters. Treat it like a password.
flagIdLabel = Flag ID
flagIdTooltip = The item flag that puts an item on the marketplace. Default 27 for "Maschinensucher".
flagFeldLabel = Flag field
flagFeldTooltip = The two flag fields are separate lists: 27 in field 2 is a different flag than 27 in field 1.
flagEins = Flag 1
flagZwei = Flag 2
flagBeide = Flag 1 or 2

kopfzeileLabel = Header line of the sample file
kopfzeileTooltip = The header line from the official sample file in the Machineseeker account. It is the only binding source for the column order.
trennerLabel = Delimiter
trennerTooltip = A single character, or the word "tab".
kodierungLabel = Character set
umbruecheLabel = Line breaks inside text
umbruecheTooltip = An importer that splits into lines first breaks on a line break inside a description. Default: replace with spaces.
umbruecheEntfernen = replace with spaces (recommended)
umbruecheBehalten = keep

preisIstLabel = Prices in Plenty are
preisIstTooltip = Dealer marketplaces list net prices. If Plenty holds gross prices, they are converted.
preisBrutto = gross (incl. VAT)
preisNetto = net
mwstLabel = VAT rate in percent
mwstTooltip = Used only for the gross to net conversion.
preislisteLabel = Sales price list (ID)
preislisteTooltip = Empty = the lowest existing ID. If the configured list is missing on an item, it gets NO price and is skipped.
waehrungLabel = Currency

kategorieLabel = Fallback category
kategorieTooltip = The Machineseeker category used when no mapping matches.
kategorieZuordnungLabel = Category mapping
kategorieZuordnungTooltip = keyword=category, comma separated, first match wins. Searched in title, manufacturer and model.
praefixLabel = Listing number prefix
praefixTooltip = If the variation number already carries the prefix, it is not added twice.
landLabel = Country
plzLabel = Postcode
ortLabel = City
ansprechpartnerLabel = Contact person
telefonLabel = Phone
emailLabel = E-mail
emailTooltip = The mailbox that receives enquiries.
shopLabel = Shop URL
shopTooltip = For the link on the listing. Empty = no link.

freigabeLabel = Release drop
freigabeTooltip = Tick only if a withheld drop was intended. The next run writes the smaller file; the release expires after twelve hours.
