<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <style>
    .brand { font-family: 'Cormorant Garamond', 'Times New Roman', Georgia, serif; font-weight: 700; fill: #1A1A1A; }
    .sub   { font-family: 'Inter', Helvetica, Arial, sans-serif; font-weight: 500; fill: #1A1A1A; letter-spacing: 14px; }
  </style>
  <!-- Linkes Wort – endet bei x=420 -->
  <text x="420" y="180" class="brand" font-size="100" text-anchor="end">CLAUDIA's</text>
  <!-- Rechtes Wort – beginnt bei x=580 -->
  <text x="580" y="180" class="brand" font-size="100" text-anchor="start">SALON</text>
  <!-- Untertitel zentriert -->
  <text x="500" y="260" class="sub" font-size="36" text-anchor="middle">HAIRSTYLIST</text>
  <!-- Schere zentriert zwischen den Wörtern -->
  <g transform="translate(500,90)" stroke="#C9A961" stroke-width="9" fill="none" stroke-linecap="round">
    <circle cx="-24" cy="180" r="24"/>
    <circle cx="24"  cy="180" r="24"/>
    <line x1="-17" y1="162" x2="22" y2="10"/>
    <line x1="17"  y1="162" x2="-22" y2="10"/>
    <circle cx="0" cy="100" r="5" fill="#C9A961"/>
  </g>
</svg>
