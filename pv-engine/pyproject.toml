[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvengine"
version = "0.1.0"
description = "Eigene PV-Planungs-Engine: Ertragsprognose, Wirtschaftlichkeit, Modul-Layout & Report (PV*SOL-Parität) ohne Fremdsoftware-Wrapper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Youman / A&B Solarenergy" }]
dependencies = [
    "pvlib>=0.11",
    "pandas>=2.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "requests>=2.31",
    "jinja2>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[project.scripts]
pvengine = "pvengine.cli:main"

[tool.setuptools.packages.find]
include = ["pvengine*"]

[tool.setuptools.package-data]
pvengine = ["../templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
