probelaufNein = No, write for real
probelaufJa = Yes, log only
probelaufTooltip = Yes: the plugin reads and decides, but only logs what it would do. Nothing is created, changed, paused or uploaded at Machineseeker. Only switch to No once the log shows exactly what should happen over several runs.
probelaufLabel = Dry run (nothing is written)
apiTokenLabel = Machineseeker API token
apiTokenTooltip = From the Machineseeker account under Useful Functions, Data Import, Real-time API. It permits creating, changing and deleting every listing - treat it like a password.
zugangTab = Access
dateiTab = Import file
preisTab = Price
inseratTab = Listing

tokenLabel = Token for the pickup URL
tokenTooltip = The secret in the URL stored in the Machineseeker account. At least 16 characters. Treat it like a password.
flagIdLabel = Flag ID
flagIdTooltip = The item flag that puts an item on the marketplace. Default 27 for "Maschinensucher".
flagFeldLabel = Flag field
flagFeldTooltip = The two flag fields are separate lists: 27 in field 2 is a different flag than 27 in field 1.
flagEins = Flag 1
flagZwei = Flag 2
flagBeide = Flag 1 or 2

kopfzeileLabel = Header line of the sample file
kopfzeileTooltip = The header line from the official sample file in the Machineseeker account. It is the only binding source for the column order.
trennerLabel = Delimiter
trennerTooltip = A single character, or the word "tab".
kodierungLabel = Character set
umbruecheLabel = Line breaks inside text
umbruecheTooltip = An importer that splits into lines first breaks on a line break inside a description. Default: replace with spaces.
umbruecheEntfernen = replace with spaces (recommended)
umbruecheBehalten = keep

preisIstLabel = Prices in Plenty are
preisIstTooltip = Dealer marketplaces list net prices. If Plenty holds gross prices, they are converted.
preisBrutto = gross (incl. VAT)
preisNetto = net
mwstLabel = VAT rate in percent
mwstTooltip = Used only for the gross to net conversion.
preislisteLabel = Sales price list (ID)
preislisteTooltip = Empty = the lowest existing ID. If the configured list is missing on an item, it gets NO price and is skipped.
waehrungLabel = Currency

kategorieLabel = Fallback category (number)
kategorieTooltip = The Machineseeker category number for items that do not exist there yet. Existing listings keep their own category, so nothing is needed here for them. Leaving it empty is fine: a new item is then held back instead of landing in the wrong category.
kategorieZuordnungLabel = Category mapping
kategorieZuordnungTooltip = keyword=category, comma separated, first match wins. Searched in title, manufacturer and model.
praefixLabel = Listing number prefix
praefixTooltip = If the variation number already carries the prefix, it is not added twice.
landLabel = Country
plzLabel = Postcode
ortLabel = City
ansprechpartnerLabel = Contact person
telefonLabel = Phone
emailLabel = E-mail
emailTooltip = The mailbox that receives enquiries.
shopLabel = Shop URL
shopTooltip = For the link on the listing. Empty = no link.

freigabeLabel = Release drop
freigabeTooltip = Tick only if a withheld drop was intended. The next run writes the smaller file; the release expires after twelve hours.

preislisteErsatzLabel = Fallback sales price list (ID)
preislisteErsatzTooltip = Used when the item has no price in the first list. Empty means: no price in the first list, no listing.
preisIstErsatzLabel = Prices in the fallback list are
preisIstErsatzTooltip = Set separately: one list may be net and the other gross.

nummernQuelleLabel = Listing number from
nummernQuelleTooltip = Machineseeker matches existing listings by this number. A different number creates duplicates next to every running listing.
quelleItemId = Plenty item ID
quelleVariantennummer = Variation number
quelleVariationId = Variation ID
rubrikEigenschaftLabel = Category property (ID)
rubrikEigenschaftTooltip = ID of a Plenty property of type selection. Per selection value: German name = category name (for staff), English name = Machineseeker category number (the most detailed subcategory, e.g. 68). If set on the item, the listing goes into this category; otherwise the category of the existing listing or the fallback category is used.
