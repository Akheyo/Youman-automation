dateiGebaut       = "Importdatei gebaut."
nichtGebaut       = "Importdatei NICHT gebaut — die zuletzt gute Datei bleibt liegen."
uebersprungen     = "Markierte Artikel, die nicht rausgehen, mit Grund."
herstellerFehlen  = "Herstellernamen nicht lesbar — das Feld bleibt im Inserat leer."
laufAbgebrochen   = "Der Lauf ist mit einer Ausnahme abgebrochen."
apiFehler = Die Maschinensucher-API hat einen Aufruf nicht angenommen.
bestandGelesen = Der Bestand bei Maschinensucher wurde gelesen.
bestandNichtGelesen = Der Bestand bei Maschinensucher konnte nicht gelesen werden.
doppelteInserate = Mehrere Inserate verweisen auf denselben Plenty-Artikel.
abgeglichen = Der Abgleich mit Maschinensucher ist gelaufen.
nichtUebertragen = Diese Artikel wurden nicht uebertragen.
sofortAbgeglichen = Ein Auftrag hat einen sofortigen Abgleich ausgeloest.
bildAbgelehnt = Ein Bild wurde von Maschinensucher nicht angenommen.
zeitplanGestartet = Ein Zeitplan des Maschinensucher-Plugins wurde gestartet.
ereignisaktionFehlt = Die Ereignisaktion konnte nicht angemeldet werden - die Zeitplaene laufen weiter.
nichtAbgeglichen = Der Abgleich wurde nicht ausgefuehrt.
probelauf = PROBELAUF - bei Maschinensucher wurde nichts geschrieben.
vorhaben = PROBELAUF - das waere passiert:
diagnoseZeitplan = Zeitplan gestartet.
diagnoseFlow = Flow-Aktion gestartet.
diagnoseOhnePositionen = Im Auftrag wurde keine Artikelposition gefunden.
diagnoseErgebnis = Ergebnis des Sofort-Abgleichs.
bestandEtappe = Eine Etappe der Bestandsaufnahme ist durch, die naechste macht weiter.
diagnoseSchritt = Schritt der Flow-Aktion.
rubrikauswahlFehlt = Die Auswahlwerte der Rubrik-Eigenschaft konnten nicht gelesen werden.
rubrikenGepflegt = Maschinensucher-Rubriken als Auswahlwerte angelegt.
rubrikenFehler = Die Rubriken konnten nicht als Auswahlwerte angelegt werden.
rubrikenBaumFehlt = Der Rubrikbaum von Maschinensucher konnte nicht gelesen werden.
abgleichLaeuftSchon = Ein Abgleich laeuft gerade schon, dieser Zeitplan setzt aus.
rubrikenErgebnis = Ergebnis der Rubrikenpflege.
altInseratGeaendert = Ein vorgefundenes Inserat wurde erfolgreich geaendert - es ist per API aenderbar.
altInseratAbgelehnt = Maschinensucher lehnt die Aenderung eines vorgefundenen Inserats ab.
loeschenAbgelehnt = Maschinensucher hat das Loeschen eines verschickten Artikels abgelehnt - das Inserat wird stattdessen pausiert.
geloescht = Verschickte Artikel: Inserate bei Maschinensucher geloescht.
markierteEingebrochen = Deutlich weniger markierte Artikel gefunden als im letzten Lauf - in diesem Lauf wird nichts wegen fehlender Markierung pausiert.
lagerNichtLesbar = Der Warenbestand konnte nicht aus dem Lager gelesen werden - es wird nur pausiert, nicht geloescht.
lagerGelesen = Warenbestand aus dem Lager gelesen (erste Antwort dieses Laufs).
verlaengert = Inserate verlaengert (Restlaufzeit unter der eingestellten Grenze).
bildNichtLadbar = Ein Bild konnte nicht von Plenty geladen werden - das Inserat geht ohne dieses Bild raus.
markierungFehlt = Bericht: Inserate bei Maschinensucher, deren Plenty-Artikel nicht markiert ist.
tagNichtLesbar = Der Tag "Preis auf Anfrage" konnte nicht gelesen werden - Preise gehen wie bisher raus.
ohnePreis = Bericht: Artikel ohne sichtbaren Preis bei Maschinensucher.
inseratliste = Liste aller Inserate bei Maschinensucher (Zusammenfassung, die Zeilen folgen in Teilen).
inseratlisteTeil = Liste aller Inserate bei Maschinensucher - Teil.
bestandErgebnis = Ergebnis der Leserunde (Bestand bei Maschinensucher).
