[package]
name = "daev-margin-tool"
version = "1.0.0"
description = "DAEV Margin Tool — Margen-Kalkulation für Gebrauchtwagenhandel"
authors = ["DAEV"]
edition = "2021"

[lib]
name = "daev_margin_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
