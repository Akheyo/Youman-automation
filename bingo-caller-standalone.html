<meta name="theme-color" content="#0d2a5e" />

<style>
  /* === Farbschema (Assyrische Flagge: Gold & Blau, Assur) ============== */
  :root {
    --blau-tief:    #0d2a5e;   /* tiefes Flaggenblau (Hintergrund)   */
    --blau-mittel:  #163a7d;   /* mittleres Blau (Panels)            */
    --blau-hell:    #2a56b5;   /* helleres Blau (Akzente)            */
    --gold:         #f2b705;   /* Assur-Gold (Hauptakzent)           */
    --gold-hell:    #ffd95a;   /* helles Gold                        */
    --rot:          #c8102e;   /* Flaggenrot                         */
    --weiss:        #f7f9ff;   /* Schrift hell                       */
    --weiss-dim:    #b9c6e6;   /* gedämpft                           */

    /* Deckkraft des Navy-Overlays über dem Lamassu-Header */
    --overlay-deckkraft: 0.42;

    --rad-gross: 28px;
    --rad-klein: 14px;
    --schatten:  0 10px 40px rgba(0,0,0,.45);
    --gold-glow: 0 0 18px rgba(242,183,5,.45);
    --font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  /* full-bleed Navy-Hintergrund */
  body {
    font-family: var(--font);
    color: var(--weiss);
    background:
      radial-gradient(1200px 700px at 50% -10%, var(--blau-mittel) 0%, var(--blau-tief) 55%, #081a3f 100%),
      var(--blau-tief);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ====================================================================
     HEADER  – Lamassu-Banner + Navy-Overlay + zentriertes Logo-Lockup
     ==================================================================== */
  header {
    position: relative;
    min-height: clamp(140px, 22vh, 230px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px clamp(16px, 4vw, 48px);

  /* dezenter dunkler Navy-Overlay (Deckkraft als CSS-Variable) */
  header .overlay {
    position: absolute; inset: 0; z-index: 1;
    background: rgba(8,20,52, var(--overlay-deckkraft));
  }
  /* feine goldene Zierlinie als Abschluss */
  header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; z-index: 2;
    background: linear-gradient(90deg, transparent, var(--gold-hell), var(--gold), var(--gold-hell), transparent);
    box-shadow: 0 0 10px rgba(242,183,5,.6);
  }

  .logo-lockup {
    position: relative; z-index: 2;
    display: flex; align-items: center;
    gap: clamp(14px, 2.6vw, 30px);
    /* lesbare Platte hinter dem Logo, damit es vor den Lamassu klar bleibt */
    background: rgba(6,16,44,.6);
    padding: clamp(8px, 1.4vh, 16px) clamp(18px, 3vw, 42px);
    border-radius: 999px;
    border: 1px solid rgba(242,183,5,.28);
    box-shadow: 0 10px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter: blur(3px);
  }
  .emblem {
    width: clamp(70px, 10vw, 120px);
    height: clamp(70px, 10vw, 120px);
    object-fit: contain;
    border-radius: 50%;
    filter: drop-shadow(0 0 16px rgba(242,183,5,.55)) drop-shadow(0 6px 10px rgba(0,0,0,.55));
  }
  .flagge {
    width: clamp(64px, 9vw, 120px);
    height: auto;
    border-radius: 6px;
    box-shadow: 0 6px 16px rgba(0,0,0,.6), 0 0 0 2px rgba(242,183,5,.55);
  }
  .titel-block { display: flex; flex-direction: column; line-height: 1.05; }
  .titel-aram {
    font-size: clamp(1.9rem, 5.2vw, 3.6rem);
    font-weight: 800;
    color: var(--gold-hell);
    text-shadow: 0 2px 14px rgba(0,0,0,.65);
  }
  .titel-de {
    font-size: clamp(.68rem, 1.5vw, 1.05rem);
    color: var(--weiss);
    letter-spacing: clamp(3px, 0.9vw, 8px);
    text-transform: uppercase;
    text-shadow: 0 1px 6px rgba(0,0,0,.8);
  }

  /* Toggle Sound/Sprache – oben rechts im Header */
  .kopf-toggle { position: absolute; top: 14px; right: clamp(12px, 3vw, 28px); z-index: 3; }
  .toggle {
    display: inline-flex; align-items: center; gap: 10px;
    cursor: pointer; user-select: none;
    background: rgba(8,20,52,.55);
    border: 1px solid rgba(255,255,255,.2);
    padding: 8px 14px; border-radius: 999px;
    font-size: clamp(.75rem, 1.3vw, .95rem);
    backdrop-filter: blur(4px);
    transition: background .2s, border-color .2s;
  }
  .toggle:hover { background: rgba(8,20,52,.75); }
  .toggle input { display: none; }
  .switch {
    width: 44px; height: 24px; border-radius: 999px;
    background: rgba(255,255,255,.25);
    position: relative; transition: background .2s; flex: none;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--weiss); transition: transform .2s;
  }
  .toggle input:checked + .switch { background: var(--gold); }
  .toggle input:checked + .switch::after { transform: translateX(20px); }

  /* ---------------- Haupt-Layout ---------------- */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr minmax(280px, 380px);
    gap: clamp(16px, 2.5vw, 32px);
    padding: clamp(16px, 3vw, 40px);
    align-items: start;
  }
  .buehne { display: flex; flex-direction: column; align-items: center; gap: clamp(16px, 2.5vw, 30px); }

  .aktuell-wrap {
    width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: clamp(260px, 40vh, 460px);
  }
  .aktuell-spalte {
    font-size: clamp(1.2rem, 3vw, 2rem);
    font-weight: 800; letter-spacing: 6px;
    color: var(--gold); text-transform: uppercase; min-height: 1.2em;
  }

  /* Bühne der Kugel: enthält Ergebnis-Kugel + Zieh-Trommel übereinander */
  .kugel-stage {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: clamp(220px, 34vw, 400px);
    height: clamp(220px, 34vw, 400px);
  }

  /* Ergebnis-Kugel (riesige aktuelle Zahl) */
  .aktuell-kugel {
    position: relative; z-index: 3;
    width: 100%; height: 100%;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, var(--gold-hell), var(--gold) 55%, #b27f00 100%);
    color: var(--blau-tief);
    box-shadow:
      0 0 0 10px rgba(242,183,5,.15),
      0 0 0 22px rgba(242,183,5,.07),
      var(--schatten),
      inset 0 -14px 30px rgba(0,0,0,.25),
      inset 0 14px 30px rgba(255,255,255,.45);
    font-weight: 900;
    font-size: clamp(5rem, 16vw, 13rem);
    line-height: 1;
    text-shadow: 0 3px 0 rgba(255,255,255,.4);
    user-select: none;
    transition: opacity .3s ease, transform .3s ease;
  }
  .aktuell-kugel.leer {
    background: radial-gradient(circle at 35% 30%, var(--blau-hell), var(--blau-mittel) 60%, var(--blau-tief) 100%);
    color: var(--weiss-dim);
    font-size: clamp(1rem, 3vw, 1.8rem);
    font-weight: 700; text-align: center; padding: 0 24px;
    text-shadow: none;
    box-shadow: 0 0 0 8px rgba(255,255,255,.05), var(--schatten);
  }
  .aktuell-kugel.verdeckt { opacity: 0; transform: scale(.5); pointer-events: none; }

  /* Reveal-Pop mit Goldglanz */
  @keyframes kugel-pop {
    0%   { transform: scale(.2) rotate(-12deg); opacity: 0; }
    55%  { transform: scale(1.14) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes glanz {
    0%   { box-shadow: 0 0 0 0 rgba(255,217,90,.0), var(--schatten); }
    40%  { box-shadow: 0 0 60px 24px rgba(255,217,90,.65), var(--schatten); }
    100% { box-shadow: 0 0 0 0 rgba(255,217,90,.0), var(--schatten); }
  }
  .aktuell-kugel.pop { animation: kugel-pop .6s cubic-bezier(.2,.9,.3,1.2), glanz 1.1s ease-out; }

  /* ====================================================================
     ZIEH-TROMMEL  (Glas-Trommel + wirbelnde Kugeln + Shamash-Spinner)
     ==================================================================== */
  .draw-stage {
    position: absolute; inset: 0; z-index: 4;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
  }
  .draw-stage.aktiv { opacity: 1; }

  .draw-stage.swirl .emblem-spinner { opacity: .62; animation: dreh 3s linear infinite; }
  .draw-stage.emblem-aus .emblem-spinner { opacity: 0; }

  /* Glas-Trommel */
  .trommel {
    position: absolute; inset: 0; z-index: 2;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%,
        rgba(255,255,255,.22), rgba(42,86,181,.18) 55%, rgba(8,22,60,.42) 100%);
    border: 3px solid rgba(255,255,255,.35);
    box-shadow:
      0 0 0 6px rgba(242,183,5,.14),
      var(--gold-glow),
      inset 0 12px 40px rgba(255,255,255,.22),
      inset 0 -22px 55px rgba(0,0,0,.45),
      0 20px 60px rgba(0,0,0,.5);
    backdrop-filter: blur(3px);
    overflow: hidden;
  }
  .trommel::after { /* Glas-Highlight */
    content: ""; position: absolute; top: 8%; left: 14%;
    width: 42%; height: 26%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.55), transparent 70%);
    filter: blur(4px);
  }

  /* wirbelnde Mini-Kugeln (rotierende Ringe, nur transform → 60fps) */
  .mini-balls { position: absolute; inset: 0; z-index: 3; }
  .ring { position: absolute; inset: 0; animation: dreh var(--dur) linear infinite; will-change: transform; }
  .draw-stage.swirl .ring { animation-duration: var(--durFast); }
  /* beim Reveal verschwinden die Mini-Kugeln, damit die Zahl frei steht */
  .draw-stage.aktiv:not(.swirl) .mini-balls { opacity: 0; transition: opacity .3s ease; }
  .mini {
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 30%, #fff, var(--c) 78%);
    box-shadow: 0 2px 5px rgba(0,0,0,.45),
                inset 0 -3px 6px rgba(0,0,0,.3),
                inset 0 3px 6px rgba(255,255,255,.5);
  }
  @keyframes dreh { to { transform: rotate(360deg); } }

  /* ---------------- Steuerung ---------------- */
  .controls { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  button.action {
    border: none; cursor: pointer; font-family: var(--font); font-weight: 800;
    border-radius: var(--rad-gross);
    transition: transform .12s ease, box-shadow .2s, filter .2s, background .2s;
    box-shadow: var(--schatten);
  }
  button.action:active { transform: translateY(2px) scale(.99); }
  button.action:disabled { cursor: not-allowed; filter: grayscale(.55) brightness(.72); box-shadow: none; }
  .btn-ziehen {
    background: linear-gradient(180deg, var(--gold-hell), var(--gold));
    color: var(--blau-tief);
    font-size: clamp(1.4rem, 3.5vw, 2.4rem);
    padding: clamp(18px, 2.4vw, 28px) clamp(40px, 6vw, 80px);
    letter-spacing: 1px; text-transform: uppercase;
  }
  .btn-ziehen:not(:disabled):hover { filter: brightness(1.06); transform: translateY(-2px); }
  .btn-neu {
    background: linear-gradient(180deg, #e2415b, var(--rot));
    color: var(--weiss); font-size: clamp(.9rem, 1.6vw, 1.1rem); padding: 14px 26px;
  }
  .btn-neu:hover { filter: brightness(1.08); }
  .hinweis { color: var(--weiss-dim); font-size: .8rem; text-align: center; }

  /* ---------------- Historie ---------------- */
  .historie { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .historie h3 {
    font-size: clamp(.75rem, 1.3vw, .95rem); color: var(--weiss-dim);
    letter-spacing: 3px; text-transform: uppercase; font-weight: 600;
  }
  .historie-leiste {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    min-height: 56px; align-items: center;
  }
  .hist-kugel {
    width: clamp(40px, 5vw, 56px); height: clamp(40px, 5vw, 56px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: clamp(1rem, 2vw, 1.4rem);
    background: linear-gradient(180deg, var(--blau-hell), var(--blau-mittel));
    color: var(--weiss); border: 2px solid rgba(255,255,255,.25);
    box-shadow: 0 4px 12px rgba(0,0,0,.35);
  }
  .hist-kugel.neueste {
    background: linear-gradient(180deg, var(--gold-hell), var(--gold));
    color: var(--blau-tief); border-color: var(--gold-hell); transform: scale(1.12);
  }
  .hist-kugel small { display: block; font-size: .55em; opacity: .8; font-weight: 700; }

  /* ---------------- Seitenleiste: Counter + Board ---------------- */
  .seitenleiste {
    display: flex; flex-direction: column; gap: clamp(14px, 2vw, 22px);
    position: sticky; top: 16px;
  }
  .counter { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .counter .karte {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: var(--rad-klein); padding: 14px; text-align: center;
  }
  .counter .zahl { font-size: clamp(1.6rem, 4vw, 2.6rem); font-weight: 900; color: var(--gold); }
  .counter .label { font-size: .75rem; letter-spacing: 2px; text-transform: uppercase; color: var(--weiss-dim); }

  .board-wrap {
    background: rgba(0,0,0,.18); border: 1px solid rgba(255,255,255,.1);
    border-radius: var(--rad-klein); padding: 14px;
  }
  .board-wrap h3 {
    font-size: .8rem; letter-spacing: 3px; text-transform: uppercase;
    color: var(--weiss-dim); margin-bottom: 12px; text-align: center; font-weight: 600;
  }
  .board { display: grid; gap: 6px; }
  .board.modus-90 { grid-template-columns: repeat(10, 1fr); }
  .board.spalten-75 {
    grid-template-columns: repeat(5, 1fr);
    grid-auto-flow: column; grid-template-rows: repeat(15, 1fr);
  }
  .board-zelle {
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px; font-weight: 700; font-size: clamp(.6rem, 1vw, .95rem);
    background: rgba(255,255,255,.05); color: var(--weiss-dim);
    border: 1px solid rgba(255,255,255,.06);
    transition: background .25s, color .25s, transform .25s, box-shadow .25s;
  }
  .board-zelle.gezogen {
    background: linear-gradient(180deg, var(--gold-hell), var(--gold));
    color: var(--blau-tief); border-color: var(--gold);
    box-shadow: 0 0 10px rgba(242,183,5,.5);
  }
  .board-zelle.aktuell { outline: 3px solid var(--rot); outline-offset: 1px; transform: scale(1.1); z-index: 2; }

  .bingo-kopf { display: none; gap: 6px; margin-bottom: 6px; }
  .bingo-kopf.modus-75 { display: grid; grid-template-columns: repeat(5, 1fr); }
  .bingo-kopf span {
    text-align: center; font-weight: 900; color: var(--gold-hell);
    font-size: clamp(.9rem, 1.6vw, 1.2rem); letter-spacing: 2px;
  }

  /* ---------------- Banner: alle gezogen ---------------- */
  .banner-fertig {
    display: none;
    background: linear-gradient(90deg, var(--rot), #e2415b);
    color: var(--weiss); text-align: center; padding: 16px;
    border-radius: var(--rad-klein);
    font-size: clamp(1.1rem, 2.5vw, 1.6rem); font-weight: 800; letter-spacing: 1px;
    box-shadow: var(--schatten);
    animation: kugel-pop .5s ease;
  }
  .banner-fertig.aktiv { display: block; }

  footer {
    text-align: center; padding: 14px; color: var(--weiss-dim);
    font-size: .75rem; letter-spacing: 1px; border-top: 1px solid rgba(255,255,255,.08);
  }

  /* ---------------- Responsiv ---------------- */
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .seitenleiste { position: static; }
  }
  /* Bewegungsreduktion respektieren */
  @media (prefers-reduced-motion: reduce) {
    .draw-stage.swirl .ring,
    .draw-stage.swirl .emblem-spinner { animation: none; }
  }
</style>
</head>

<script>
/* =========================================================
   KONFIGURATION
   MAX_ZAHL = 90  → klassisches Bingo, Board 10×9
   MAX_ZAHL = 75  → B-I-N-G-O Bingo, Board 5 Spalten × 15 (Spaltenlogik)
   ========================================================= */
const MAX_ZAHL = 90;

const HISTORIE_ANZ = 6;
const SPALTEN_75 = ["B", "I", "N", "G", "O"]; // 1-15, 16-30, 31-45, 46-60, 61-75

/* Dauer der Zieh-Animation (gesamt 2s) */
const T_EMBLEM_AUS = 1400;   // Emblem beginnt auszublenden
const T_REVEAL     = 1700;   // Kugel poppt nach vorn
const T_ENDE       = 2000;   // Sequenz fertig, Button wieder frei

const MINI_FARBEN = ["#ffd95a", "#2a56b5", "#c8102e", "#f2b705", "#f7f9ff"];

/* ---------------- State (nur im Speicher) ---------------- */
let pool = [];
let gezogen = [];
let aktuelleZahl = null;
let animierend = false;
let timer = [];   // laufende Timeouts (für sauberen Reset)

/* ---------------- DOM ---------------- */
const el = {
  kugel:      document.getElementById("aktuellKugel"),
  spalte:     document.getElementById("aktuellSpalte"),
  drawStage:  document.getElementById("drawStage"),
  miniBalls:  document.getElementById("miniBalls"),
  btnZiehen:  document.getElementById("btnZiehen"),
  btnNeu:     document.getElementById("btnNeu"),
  histLeiste: document.getElementById("historieLeiste"),
  cGezogen:   document.getElementById("cGezogen"),
  cUebrig:    document.getElementById("cUebrig"),
  board:      document.getElementById("board"),
  boardTitel: document.getElementById("boardTitel"),
  bingoKopf:  document.getElementById("bingoKopf"),
  banner:     document.getElementById("bannerFertig"),
  soundToggle:document.getElementById("soundToggle"),
};

const ist75 = MAX_ZAHL === 75;
const reduzierteBewegung =
  window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- Hilfsfunktionen ---------------- */
function spalteFuer(zahl) {
  if (!ist75) return "";
  return SPALTEN_75[Math.floor((zahl - 1) / 15)];
}

/* Glas-Trommel mit wirbelnden Kugeln aufbauen (rotierende Ringe) */
function trommelAufbauen() {
  const ringe = [
    { r: 42, n: 7, dir:  1, dur: 7.0 },
    { r: 31, n: 6, dir: -1, dur: 5.5 },
    { r: 20, n: 4, dir:  1, dur: 4.0 },
  ];
  el.miniBalls.innerHTML = "";
  ringe.forEach((ring, ri) => {
    const w = document.createElement("div");
    w.className = "ring";
    w.style.setProperty("--dur", ring.dur + "s");
    w.style.setProperty("--durFast", (ring.dur / 5).toFixed(2) + "s");
    if (ring.dir < 0) w.style.animationDirection = "reverse";

    for (let i = 0; i < ring.n; i++) {
      const ang = (i / ring.n) * Math.PI * 2 + ri;          // Startwinkel
      const b = document.createElement("div");
      b.className = "mini";
      b.style.left = (50 + ring.r * Math.cos(ang)) + "%";
      b.style.top  = (50 + ring.r * Math.sin(ang)) + "%";
      const sz = 9 + Math.random() * 11;
      b.style.width = sz + "px";
      b.style.height = sz + "px";
      b.style.setProperty("--c", MINI_FARBEN[(i + ri) % MINI_FARBEN.length]);
      w.appendChild(b);
    }
    el.miniBalls.appendChild(w);
  });
}

/* Web Audio: kurzer "Pling" beim Reveal */
let audioCtx = null;
function plingSpielen() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    [880, 1320].forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, t + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.25, t + i * 0.08 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.08 + 0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t + i * 0.08);
      osc.stop(t + i * 0.08 + 0.4);
    });
  } catch (e) { /* Audio nicht verfügbar */ }
}

/* Sprachausgabe (Deutsch) – Aramäisch wird von Browser-TTS nicht unterstützt */
function zahlSprechen(zahl) {
  if (!("speechSynthesis" in window)) return;
  const sp = spalteFuer(zahl);
  const text = ist75 ? `${sp}, ${zahl}` : `${zahl}`;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE"; u.rate = 0.9; u.pitch = 1.0;
  const deStimme = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("de"));
  if (deStimme) u.voice = deStimme;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ---------------- Board ---------------- */
function boardAufbauen() {
  el.board.innerHTML = "";
  el.board.className = "board " + (ist75 ? "spalten-75" : "modus-90");
  el.boardTitel.textContent = `Übersicht 1–${MAX_ZAHL}`;
  el.bingoKopf.className = "bingo-kopf" + (ist75 ? " modus-75" : "");

  for (let n = 1; n <= MAX_ZAHL; n++) {
    const z = document.createElement("div");
    z.className = "board-zelle";
    z.id = "zelle-" + n;
    z.textContent = n;
    el.board.appendChild(z);
  }
}

/* ---------------- Anzeige aktualisieren ---------------- */
function uiAktualisieren() {
  el.cGezogen.textContent = gezogen.length;
  el.cUebrig.textContent = pool.length;

  el.histLeiste.innerHTML = "";
  gezogen.slice(-HISTORIE_ANZ).reverse().forEach((z, i) => {
    const k = document.createElement("div");
    k.className = "hist-kugel" + (i === 0 ? " neueste" : "");
    const sp = spalteFuer(z);
    k.innerHTML = sp ? `<span>${z}<small>${sp}</small></span>` : `${z}`;
    el.histLeiste.appendChild(k);
  });

  const fertig = pool.length === 0 && gezogen.length > 0;
  el.banner.classList.toggle("aktiv", fertig);
  el.btnZiehen.disabled = pool.length === 0 || animierend;
  el.btnZiehen.textContent = fertig ? "✓ Fertig" : (animierend ? "Zieht …" : "🎲 Zahl ziehen");
}

/* Ergebnis-Kugel mit der gezogenen Zahl anzeigen + Pop */
function kugelReveal(zahl) {
  el.kugel.classList.remove("leer", "pop", "verdeckt");
  el.kugel.textContent = zahl;
  el.spalte.textContent = ist75 ? spalteFuer(zahl) : "";
  void el.kugel.offsetWidth;          // Reflow → Animation neu starten
  el.kugel.classList.add("pop");

  // Board markieren
  if (aktuelleZahl !== null) {
    const alt = document.getElementById("zelle-" + aktuelleZahl);
    if (alt) alt.classList.remove("aktuell");
  }
  aktuelleZahl = zahl;
  const zelle = document.getElementById("zelle-" + zahl);
  if (zelle) zelle.classList.add("gezogen", "aktuell");

  // Ton & Sprache
  if (el.soundToggle.checked) { plingSpielen(); zahlSprechen(zahl); }

  uiAktualisieren();
}

/* ---------------- Zahl ziehen (mit Trommel-Animation) ---------------- */
function zahlZiehen() {
  if (animierend || pool.length === 0) return;

  // Zahl sofort ermitteln, optisch erst am Ende der Sequenz zeigen
  const idx = Math.floor(Math.random() * pool.length);
  const zahl = pool.splice(idx, 1)[0];
  gezogen.push(zahl);

  // Schneller Pfad bei Bewegungsreduktion
  if (reduzierteBewegung) {
    kugelReveal(zahl);
    return;
  }

  animierend = true;
  uiAktualisieren();                  // Button sperren ("Zieht …")

  // Trommel zeigen, Kugel verdecken, Wirbeln + Emblem-Spinner starten
  el.kugel.classList.add("verdeckt");
  el.drawStage.classList.add("aktiv", "swirl");

  timer.push(setTimeout(() => {
    el.drawStage.classList.add("emblem-aus");   // 1.4s: Emblem blendet aus
  }, T_EMBLEM_AUS));

  timer.push(setTimeout(() => {
    el.drawStage.classList.remove("swirl");     // 1.7s: Mini-Kugeln raus
    kugelReveal(zahl);                          //        Kugel poppt nach vorn
  }, T_REVEAL));

  timer.push(setTimeout(() => {
    el.drawStage.classList.remove("aktiv", "emblem-aus");  // 2.0s: Trommel weg
    animierend = false;
    timer = [];
    uiAktualisieren();
  }, T_ENDE));
}

/* ---------------- Neues Spiel ---------------- */
function neuesSpiel() {
  timer.forEach(clearTimeout); timer = [];
  animierend = false;

  pool = Array.from({ length: MAX_ZAHL }, (_, i) => i + 1);
  gezogen = [];
  aktuelleZahl = null;

  document.querySelectorAll(".board-zelle.gezogen, .board-zelle.aktuell")
    .forEach(z => z.classList.remove("gezogen", "aktuell"));

  el.drawStage.classList.remove("aktiv", "swirl", "emblem-aus");
  el.kugel.classList.remove("pop", "verdeckt");
  el.kugel.classList.add("leer");
  el.kugel.textContent = "Bereit zum Ziehen";
  el.spalte.textContent = "";

  if (window.speechSynthesis) speechSynthesis.cancel();
  uiAktualisieren();
}

/* ---------------- Events ---------------- */
el.btnZiehen.addEventListener("click", zahlZiehen);

el.btnNeu.addEventListener("click", () => {
  if (gezogen.length === 0 || confirm("Neues Spiel starten? Alle gezogenen Zahlen werden zurückgesetzt.")) {
    neuesSpiel();
  }
});

document.addEventListener("keydown", (e) => {
  // Leertaste = ziehen (während Animation gesperrt)
  if (e.code === "Space" && !animierend && pool.length > 0) {
    e.preventDefault();
    zahlZiehen();
  }
});

if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = () => {};
  speechSynthesis.getVoices();
}

/* ---------------- Start ---------------- */
boardAufbauen();
trommelAufbauen();
neuesSpiel();
</script>
