name: adept& Website auf GitHub Pages

# Baut den Ordner adept-website/ und veröffentlicht ihn über GitHub Pages.
#
# Die Adresse ergibt sich aus den Pages-Einstellungen des Repos: mit
# eingetragener eigener Domain läuft die Seite dort, sonst unter
# https://akheyo.github.io/Youman-automation/
#
# public/CNAME bleibt bewusst im Build, damit die eingestellte eigene Domain
# erhalten bleibt.
#
# Sobald die Seite ein eigenes Repo hat, greift stattdessen
# adept-website/.github/workflows/deploy.yml und diese Datei kann weg.

on:
  push:
    branches:
      - main
      - claude/new-session-b4oeuo
    paths:
      - 'adept-website/**'
      - '.github/workflows/adept-website-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adept-website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adept-website/package-lock.json

      - name: Pages konfigurieren
        id: pages
        # Kein enablement: das Anlegen der Pages-Site per API erfordert
        # Adminrechte, die der Workflow-Token nicht hat. Pages muss einmalig
        # unter Settings, Pages, Source: GitHub Actions eingeschaltet werden.
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: adept-website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
