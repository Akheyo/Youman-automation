# Veroeffentlicht die Entwurfs-Vorschau von Sapore Grill auf GitHub Pages.
#
# Warum ein eigener Workflow: die Seite selbst ist eine Next.js-Anwendung mit
# Serverteil (Bestellannahme, Kuechenansicht) und laesst sich nicht als
# statische Dateien ausliefern. Der Ordner `preview/` enthaelt dagegen eine
# eigenstaendige Fassung, die ohne Server auskommt — genau das, was sich zum
# Ansehen und Weitergeben eignet.
#
# Voraussetzung: In den Repository-Einstellungen unter Pages muss als Quelle
# "GitHub Actions" eingestellt sein. Steht dort ein Branch, schlaegt der letzte
# Schritt fehl und die Einstellung muss einmal umgestellt werden.

name: Sapore Grill – Vorschau auf Pages

on:
  push:
    branches:
      - claude/website-bauen-gma34d
    paths:
      - 'preview/**'
      - '.github/workflows/sapore-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Veroeffentlichungen nicht abbrechen, aber auch nicht stapeln.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir -p site
          cp preview/sapore-grill.html site/index.html
          cp preview/README.md site/ 2>/dev/null || true
          # Jekyll ueberspringen: die Datei soll unveraendert ausgeliefert werden.
          touch site/.nojekyll

      - name: Pages einrichten
        uses: actions/configure-pages@v5

      - name: Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
