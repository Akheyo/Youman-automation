name: PV-Engine Windows-App (.exe)

# Baut die Desktop-App als einzelne Windows-.exe (zum Doppelklicken, ohne
# Python-Installation beim Nutzer). Artifact = PV-Planungs-Engine.exe.
#
# PDF-Hinweis: WeasyPrint braucht auf Windows separate GTK-Libs und wird daher
# NICHT in die .exe gepackt. Der Report wird als eigenständige HTML-Datei
# erzeugt (identisches Layout, öffnet im Browser; dort via Strg+P → „Als PDF
# speichern"). Aus Python heraus (mit WeasyPrint installiert) bleibt echtes PDF.

on:
  workflow_dispatch:
  push:
    paths:
      - "pv-engine/pvengine/gui.py"
      - "pv-engine/run_gui.py"
      - "installer/**"
      - ".github/workflows/build-windows-app.yml"

concurrency:
  group: win-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pv-engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pv-engine/requirements.txt

      - name: Dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pvlib pandas numpy matplotlib jinja2 pydantic requests pyinstaller

      - name: Build .exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "PV-Planungs-Engine" `
            --collect-all pvlib `
            --add-data "templates;templates" `
            run_gui.py

      - name: Selbsttest der gebauten .exe (Rechenkern + Report)
        run: |
          Remove-Item "$env:TEMP\pvengine_selftest.txt" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath ".\dist\PV-Planungs-Engine.exe" `
               -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path "$env:TEMP\pvengine_selftest.txt") {
            Write-Host "--- Selbsttest-Marker ---"
            Get-Content "$env:TEMP\pvengine_selftest.txt"
          }
          if ($p.ExitCode -ne 0) { Write-Error "Selbsttest fehlgeschlagen (Exit $($p.ExitCode))"; exit 1 }
          Write-Host "Selbsttest OK"

      - name: Inno Setup installieren
        working-directory: ${{ github.workspace }}
        run: choco install innosetup -y --no-progress

      - name: Setup.exe (Installer) bauen
        working-directory: ${{ github.workspace }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\pvengine.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "Installer-Build fehlgeschlagen"; exit 1 }
          Get-ChildItem "installer\Output"

      - name: Setup.exe als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PV-Planungs-Engine-Setup
          path: installer/Output/PV-Planungs-Engine-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Portable .exe als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PV-Planungs-Engine-portable
          path: pv-engine/dist/PV-Planungs-Engine.exe
          if-no-files-found: error
          retention-days: 30
