name: Paletten Mini - Build Installer

on:
  push:
    branches:
      - main
      - "claude/palette-optimizer-build-**"
    paths:
      - "paletten-optimierer/mini/**"
      - ".github/workflows/paletten-mini.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (z.B. 1.0.0)"
        required: true
        default: "1.0.0"

defaults:
  run:
    working-directory: paletten-optimierer/mini

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version bestimmen
        id: vars
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.0.0" }
          Write-Host "Version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: paletten-optimierer/mini/requirements.txt

      - name: Dependencies installieren
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build-Identitaet einbrennen
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $when = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm UTC")
          $ver = $env:APP_VERSION
          $content = @"
          # Auto-generated by GitHub Actions
          from __future__ import annotations

          BUILD_SHA: str = "$sha"
          BUILD_DATE: str = "$when"
          BUILD_VERSION: str = "$ver"
          "@
          Set-Content -Path "_build_info.py" -Value $content -Encoding UTF8
          Write-Host "Build-Stempel: $sha / $when / v$ver"

      - name: Pflicht-Test Kern Modell A (v4, Cluster + Deckel-Obergrenze)
        shell: pwsh
        env: { PYTHONIOENCODING: utf-8 }
        run: python tests/test_kern_modell_a.py

      - name: Pflicht-Test Struktur (Code-erzeugte Fixtures)
        shell: pwsh
        env: { PYTHONIOENCODING: utf-8 }
        run: python tests/test_kern_struktur.py

      - name: Optionaler Test Echtdatei (Skip wenn Paletten_DM.xlsx fehlt)
        shell: pwsh
        env: { PYTHONIOENCODING: utf-8 }
        run: python tests/test_kern_echt.py

      - name: Pflicht-Test Import-Produkt (Domain-Fix P-Werte -> Produkt)
        shell: pwsh
        env: { PYTHONIOENCODING: utf-8 }
        run: python tests/test_import_produkt.py

      - name: Pflicht-Test Toggle-Wiring (UI -> Kern v4 1:1)
        shell: pwsh
        env: { PYTHONIOENCODING: utf-8 }
        run: python tests/test_toggle_wiring.py

      - name: Pflicht-Test Typ-Anzeige (4 Typen + Farbcodes)
        shell: pwsh
        env: { PYTHONIOENCODING: utf-8 }
        run: python tests/test_typ_anzeige.py

      - name: Pflicht-Test Import-Verlauf
        shell: pwsh
        env: { PYTHONIOENCODING: utf-8 }
        run: python tests/test_verlauf.py

      - name: Pflicht-Test Palettenkatalog (Tie-Breaker + CRUD)
        shell: pwsh
        env: { PYTHONIOENCODING: utf-8 }
        run: python tests/test_katalog.py

      - name: Pflicht-Test Toleranz-Modus (mm / %)
        shell: pwsh
        env: { PYTHONIOENCODING: utf-8 }
        run: python tests/test_toleranz_modus.py

      - name: Pflicht-Test Sonderpaletten-Option + Score-Breakdown
        shell: pwsh
        env: { PYTHONIOENCODING: utf-8 }
        run: python tests/test_sonder_score.py

      - name: Selbsttest-Status anzeigen
        shell: pwsh
        run: |
          if (Test-Path "selbsttest_status.json") {
            Write-Host "=== Selbsttest-Status (wird in EXE eingebrannt) ==="
            Get-Content "selbsttest_status.json"
          } else {
            Write-Host "WARN: kein selbsttest_status.json gefunden"
          }

      - name: Icon erzeugen (Platzhalter, reuse aus Hauptapp)
        shell: pwsh
        working-directory: paletten-optimierer/mini/build
        run: |
          if (Test-Path "..\..\build\icon.ico") {
            Copy-Item "..\..\build\icon.ico" "icon.ico"
          } else {
            python -c "from PIL import Image; img=Image.new('RGB',(256,256),'#2563eb'); img.save('icon.ico')"
          }

      - name: PyInstaller-Build
        shell: pwsh
        working-directory: paletten-optimierer/mini/build
        run: pyinstaller paletten-mini.spec --noconfirm --clean

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Setup.exe bauen
        shell: pwsh
        working-directory: paletten-optimierer/mini/build
        env:
          APP_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PalettenMini-Setup-${{ steps.vars.outputs.version }}
          path: paletten-optimierer/mini/build/output/*.exe
          if-no-files-found: error
          retention-days: 30
