name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Generate App-Icon (PowerShell + System.Drawing)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri\icons" | Out-Null
          Add-Type -AssemblyName System.Drawing
          $size = 1024
          $bmp = New-Object System.Drawing.Bitmap($size, $size, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit
          $bgColor = [System.Drawing.Color]::FromArgb(255, 15, 23, 42)   # slate-900
          $fgColor = [System.Drawing.Color]::White
          $g.Clear($bgColor)
          # abgerundete Ecken weglassen für Vollflächigkeit — Tauri rundet selbst
          $fontSize = [float]($size * 0.42)
          $font = New-Object System.Drawing.Font("Arial", $fontSize, [System.Drawing.FontStyle]::Bold)
          $brush = New-Object System.Drawing.SolidBrush($fgColor)
          $sf = New-Object System.Drawing.StringFormat
          $sf.Alignment = [System.Drawing.StringAlignment]::Center
          $sf.LineAlignment = [System.Drawing.StringAlignment]::Center
          $rect = New-Object System.Drawing.RectangleF(0, 0, $size, $size)
          $g.DrawString("DAEV", $font, $brush, $rect, $sf)
          $bmp.Save("app-icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          Write-Host "App-Icon erzeugt: app-icon.png"

      - name: Tauri-Icon-Set generieren
        run: npx @tauri-apps/cli icon app-icon.png --output src-tauri/icons

      - name: Tauri Build
        run: npx @tauri-apps/cli build
        env:
          # Code-Signing optional – wenn Zertifikat-Secrets gesetzt sind, hier durchschleifen.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAEV-Margin-Tool-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: GitHub Release veröffentlichen (nur bei Tag-Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
