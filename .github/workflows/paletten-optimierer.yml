name: Youman - Build Installer

on:
  push:
    branches:
      - main
      - "claude/palette-optimizer-build-**"
    tags:
      - "v*.*.*"
    paths:
      - "paletten-optimierer/**"
      - ".github/workflows/paletten-optimierer.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (z.B. 1.0.0)"
        required: true
        default: "1.0.0"
      trial_days:
        description: "Test-Zeitraum in Tagen (0 = unbegrenzt)"
        required: false
        default: "30"
      lizenznehmer:
        description: "Lizenznehmer (Anzeigename im Banner)"
        required: false
        default: "Test-Version"
      kontakt:
        description: "Kontakt-Hinweis im Banner (E-Mail/Telefon)"
        required: false
        default: ""

defaults:
  run:
    working-directory: paletten-optimierer

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    env:
      LOGO_URL: "https://i.ibb.co/6cp0nhRZ/f3226217-0594-4d31-9986-5e6d32b9b4fe.png"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version bestimmen
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart("v")
          } else {
            $version = "${{ inputs.version }}"
          }
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.0.0" }
          Write-Host "Version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: paletten-optimierer/requirements.txt

      - name: Dependencies installieren
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Logo herunterladen (mit Fallback)
        shell: pwsh
        run: |
          $logo = "assets/youman_logo.png"
          New-Item -ItemType Directory -Force -Path "assets" | Out-Null
          $headers = @{ "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"; "Referer" = "https://ibb.co/" }
          try {
            Invoke-WebRequest -Uri $env:LOGO_URL -OutFile $logo -Headers $headers -UseBasicParsing -TimeoutSec 30
            $size = (Get-Item $logo).Length
            Write-Host "Logo heruntergeladen: $size bytes"
            if ($size -lt 100) { throw "Logo zu klein, vermutlich Fehler-Antwort" }
          } catch {
            Write-Host "Logo-Download fehlgeschlagen: $_"
            Write-Host "Verwende vorhandenes Logo aus dem Repo (assets/youman_logo.png)"
            if (-not (Test-Path $logo)) {
              Write-Host "Fallback wird beim Icon-Build erzeugt"
            }
          }

      - name: Lizenz-Konfiguration setzen
        shell: pwsh
        run: |
          $trialDays = "${{ inputs.trial_days }}"
          if ([string]::IsNullOrWhiteSpace($trialDays)) { $trialDays = "30" }
          $days = [int]$trialDays
          $lizenznehmer = "${{ inputs.lizenznehmer }}"
          if ([string]::IsNullOrWhiteSpace($lizenznehmer)) { $lizenznehmer = "Test-Version" }
          $kontakt = "${{ inputs.kontakt }}"

          if ($days -le 0) {
            $expiresLine = "LICENSE_EXPIRES: str | None = None"
            $info = "unbegrenzt"
          } else {
            $expDate = (Get-Date).AddDays($days).ToString("yyyy-MM-dd")
            $expiresLine = "LICENSE_EXPIRES: str | None = `"$expDate`""
            $info = "$expDate ($days Tage)"
          }
          $content = @"
          # Auto-generated by GitHub Actions
          from __future__ import annotations
          from datetime import date

          $expiresLine
          LIZENZNEHMER: str = "$lizenznehmer"
          KONTAKT: str = "$kontakt"


          def expiry_date():
              if LICENSE_EXPIRES is None:
                  return None
              try:
                  return date.fromisoformat(LICENSE_EXPIRES)
              except (TypeError, ValueError):
                  return None


          def ist_abgelaufen(heute=None):
              exp = expiry_date()
              if exp is None:
                  return False
              heute = heute or date.today()
              return heute > exp


          def tage_verbleibend(heute=None):
              exp = expiry_date()
              if exp is None:
                  return None
              heute = heute or date.today()
              return (exp - heute).days
          "@
          Set-Content -Path "license_config.py" -Value $content -Encoding UTF8
          Write-Host "Lizenz: $info, Lizenznehmer: $lizenznehmer"

      - name: Beispieldaten regenerieren
        shell: pwsh
        run: |
          if (Test-Path "data/draht_mueller_raw.tsv") {
            python scripts/import_draht_mueller.py
          } else {
            python -c "from excel_handler import erstelle_beispiel_excel; erstelle_beispiel_excel('data/beispiel_palettenliste.xlsx', 80)"
          }

      - name: Icon erzeugen
        shell: pwsh
        working-directory: paletten-optimierer/build
        run: python generate_icon.py icon.ico

      - name: PyInstaller-Build
        shell: pwsh
        working-directory: paletten-optimierer/build
        run: pyinstaller paletten-optimierer.spec --noconfirm --clean

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Setup.exe bauen
        shell: pwsh
        working-directory: paletten-optimierer/build
        env:
          APP_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Setup.exe als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Youman-Setup-${{ steps.vars.outputs.version }}
          path: paletten-optimierer/dist/installer/*.exe
          if-no-files-found: error

      - name: GitHub Release erstellen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Youman ${{ steps.vars.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: paletten-optimierer/dist/installer/*.exe
