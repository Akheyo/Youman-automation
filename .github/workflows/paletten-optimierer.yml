name: Paletten Optimierer - Build Installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (z.B. 1.0.0)"
        required: true
        default: "1.0.0"

defaults:
  run:
    working-directory: paletten-optimierer

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version bestimmen
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart("v")
          } else {
            $version = "${{ inputs.version }}"
          }
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.0.0" }
          Write-Host "Version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: paletten-optimierer/requirements.txt

      - name: Dependencies installieren
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Beispieldaten erzeugen
        shell: pwsh
        run: |
          python -c "from excel_handler import erstelle_beispiel_excel; erstelle_beispiel_excel('data/beispiel_palettenliste.xlsx', 80)"

      - name: Icon erzeugen
        shell: pwsh
        working-directory: paletten-optimierer/build
        run: python generate_icon.py icon.ico

      - name: PyInstaller-Build
        shell: pwsh
        working-directory: paletten-optimierer/build
        run: pyinstaller paletten-optimierer.spec --noconfirm --clean

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Setup.exe bauen
        shell: pwsh
        working-directory: paletten-optimierer/build
        env:
          APP_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Setup.exe als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PalettenOptimierer-Setup-${{ steps.vars.outputs.version }}
          path: paletten-optimierer/dist/installer/*.exe
          if-no-files-found: error

      - name: GitHub Release erstellen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Paletten Optimierer ${{ steps.vars.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: paletten-optimierer/dist/installer/*.exe
