name: Youman Desktop - Build Installer

on:
  push:
    branches:
      - main
      - "claude/palette-optimizer-build-**"
    paths:
      - "paletten-optimierer/desktop/**"
      - "paletten-optimierer/assets/**"
      - "paletten-optimierer/mini/palettenkatalog.py"
      - "paletten-optimierer/mini/auftraege.py"
      - "paletten-optimierer/mini/optimierer_kern.py"
      - "paletten-optimierer/mini/import_excel.py"
      - "paletten-optimierer/mini/import_verlauf.py"
      - "paletten-optimierer/mini/audit_log.py"
      - ".github/workflows/youman-desktop.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (z.B. 2.0.0)"
        required: true
        default: "2.0.0"

defaults:
  run:
    working-directory: paletten-optimierer/desktop

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version bestimmen
        id: vars
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "2.0.0" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: paletten-optimierer/desktop/requirements.txt

      - name: Dependencies installieren
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build-Identitaet einbrennen
        shell: pwsh
        working-directory: paletten-optimierer/mini
        env:
          APP_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $when = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm UTC")
          $ver = $env:APP_VERSION
          $content = @"
          # Auto-generated by GitHub Actions
          from __future__ import annotations

          BUILD_SHA: str = "$sha"
          BUILD_DATE: str = "$when"
          BUILD_VERSION: str = "$ver"
          "@
          Set-Content -Path "_build_info.py" -Value $content -Encoding UTF8

      - name: Icon erzeugen
        shell: pwsh
        working-directory: paletten-optimierer/desktop/build
        run: python ../../mini/tools/make_icon.py ../../assets/youman_logo.png icon.ico

      - name: PyInstaller-Build
        shell: pwsh
        working-directory: paletten-optimierer/desktop/build
        run: pyinstaller youman-desktop.spec --noconfirm --clean

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Setup.exe bauen
        shell: pwsh
        working-directory: paletten-optimierer/desktop/build
        env:
          APP_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Youman-Desktop-${{ steps.vars.outputs.version }}
          path: paletten-optimierer/desktop/build/output/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Release "desktop-latest" updaten
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Youman Desktop ${{ steps.vars.outputs.version }} (latest build)
          body: |
            **Echte Desktop-App** auf CustomTkinter-Basis. Kein Browser, kein Server.

            · Commit: `${{ github.sha }}`
            · Version: ${{ steps.vars.outputs.version }}
            · Edition: Basic (6 Tabs)

            **Download:** Setup unten unter Assets.
          files: paletten-optimierer/desktop/build/output/*.exe
          prerelease: false
          make_latest: "false"
          token: ${{ secrets.GITHUB_TOKEN }}
