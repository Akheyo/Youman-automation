# Setzt die eigene Domain in den GitHub-Pages-Einstellungen.
#
# Warum ein Workflow? Die eigene Domain steht nicht in einer Datei im
# Repository, sondern in den Pages-Einstellungen. Eine CNAME-Datei in
# public/ aendert daran nichts: Bei einem Deploy ueber Actions liest GitHub
# sie nicht, das ist das alte Verhalten beim Deploy aus einem Branch. Der
# Weg ohne Klickerei ist die Pages-API, und die erreicht der Workflow-Token
# mit der Berechtigung pages: write. So wurde die alte Domain auch geloest
# (domain-loesen.yml, inzwischen entfernt).
#
# Reihenfolge, die zaehlt: ERST die DNS-Eintraege beim Domainanbieter, DANN
# dieser Workflow. Sobald die Domain hier steht, leitet GitHub die
# github.io-Adresse per 301 auf die Domain um. Zeigt die Domain dann noch
# ins Leere, ist die Seite ueber keinen Weg mehr erreichbar. Der Workflow
# prueft deshalb vorher, ob die DNS-Eintraege stimmen, und bricht sonst ab.
#
# Was beim Domainanbieter stehen muss:
#
#   www.youman-automation.de   CNAME   akheyo.github.io
#   youman-automation.de       A       185.199.108.153
#   youman-automation.de       A       185.199.109.153
#   youman-automation.de       A       185.199.110.153
#   youman-automation.de       A       185.199.111.153
#
# Die vier A-Eintraege fuer die Adresse ohne www sind nicht Pflicht, aber
# ohne sie fuehrt youman-automation.de ins Leere; mit ihnen leitet GitHub
# von dort auf www weiter.
#
# Drei Eingaben:
#
#   domain     Vorgabe www.youman-automation.de. Nur aendern, wenn die
#              Domain wirklich eine andere ist.
#   https      "ja" erzwingt HTTPS. Erst beim ZWEITEN Lauf setzen: GitHub
#              stellt das Zertifikat nach dem Setzen der Domain aus, das
#              dauert Minuten bis eine Stunde. Vorher lehnt die API das
#              Erzwingen mit 422 ab.
#   erzwingen  "ja" ueberspringt die DNS-Pruefung. Nur, wenn man genau
#              weiss, warum die Pruefung falsch liegt.
#   warten     Minuten, die auf die DNS-Umstellung gewartet wird. Mit einem
#              Wert groesser 0 laesst sich der Workflow VOR der Umstellung
#              beim Anbieter starten: Er prueft jede Minute und setzt die
#              Domain, sobald die Eintraege stehen. 0 heisst einmal pruefen
#              und sonst abbrechen. Sinnvoll sind 30 bis 60; ein Lauf darf
#              hoechstens sechs Stunden dauern.
#
# Der Umzug von einem anderen Anbieter: Beim Domainanbieter zeigen die
# Eintraege dann noch dorthin und muessen ERSETZT werden, nicht ergaenzt.
# Zwei CNAME-Eintraege fuer denselben Namen sind nicht zulaessig, und ein
# alter A-Eintrag neben den GitHub-Adressen schickt jeden zweiten Besucher
# zum alten Ziel.
#
# Am Ende stoesst der Workflow den Pages-Deploy neu an, damit canonical,
# og:url und Sitemap die Domain tragen: Die Seite bezieht ihre Adresse beim
# Bauen aus configure-pages, ein alter Build kennt die Domain nicht.

name: Eigene Domain in den Pages-Einstellungen setzen

on:
  # Der Push-Ausloeser tut nichts (der Job unten prueft das Ereignis), er
  # meldet den Workflow nur bei GitHub an. Ein Workflow, der ausschliesslich
  # per Hand startbar ist und nicht auf dem Standard-Branch liegt, taucht
  # sonst weder in der Actions-Liste noch in der API auf: der Start antwortet
  # dann mit 404, obwohl die Datei im Branch steht.
  push:
    branches:
      - main
      - claude/new-session-b4oeuo
    paths:
      - '.github/workflows/domain-setzen.yml'
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain, unter der die Seite laufen soll'
        required: true
        default: 'www.youman-automation.de'
      https:
        description: 'HTTPS erzwingen (ja/nein). Erst beim zweiten Lauf, wenn das Zertifikat da ist.'
        required: false
        default: 'nein'
      erzwingen:
        description: 'DNS-Pruefung ueberspringen (ja/nein)'
        required: false
        default: 'nein'
      warten:
        description: 'Minuten auf die DNS-Umstellung warten (0 = einmal pruefen)'
        required: false
        default: '0'

permissions:
  pages: write
  actions: write

jobs:
  setzen:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ inputs.domain }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      API: https://api.github.com/repos/${{ github.repository }}/pages
    steps:
      - name: Stand vorher
        run: |
          echo "--- Pages-Einstellungen vorher ---"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" "$API" \
            | grep -E '"(cname|html_url|status|https_enforced|protected_domain_state)"' || true

      - name: DNS pruefen
        if: inputs.erzwingen != 'ja'
        timeout-minutes: 360
        env:
          WARTEN: ${{ inputs.warten }}
        run: |
          # Gefragt wird ein oeffentlicher Resolver statt des lokalen. Der
          # Resolver des Runners haelt Antworten bis zum Ablauf ihrer TTL
          # fest, und beim Umzug einer Domain ist genau die alte Antwort das
          # Falsche. 1.1.1.1 und 8.8.8.8, damit ein Ausfall eines der beiden
          # den Lauf nicht scheitern laesst.
          pruefe() {
            local name="$1" typ="$2" wert=""
            for resolver in 1.1.1.1 8.8.8.8; do
              wert=$(dig +short +time=3 +tries=1 "@$resolver" "$name" "$typ" 2>/dev/null | tr '\n' ' ')
              [ -n "$wert" ] && break
            done
            echo "$wert"
          }

          apex=$(echo "$DOMAIN" | sed 's/^www\.//')
          grenze=$(( $(date +%s) + ${WARTEN:-0} * 60 ))
          versuch=0

          while :; do
            versuch=$((versuch + 1))
            cname=$(pruefe "$DOMAIN" CNAME)
            a=$(pruefe "$DOMAIN" A)
            apex_a=$(pruefe "$apex" A)

            echo "--- Versuch $versuch, $(date -u +%H:%M:%SZ) ---"
            echo "$DOMAIN  CNAME: ${cname:-keiner}"
            echo "$DOMAIN  A:     ${a:-keine}"
            echo "$apex  A:     ${apex_a:-keine}"

            ok=nein
            case "$cname" in
              *github.io.*) ok=ja ;;
            esac
            # Ohne CNAME reicht es, wenn die A-Eintraege zu GitHub Pages
            # zeigen (185.199.108.0/22).
            case " $a " in
              *" 185.199.108."*|*" 185.199.109."*|*" 185.199.110."*|*" 185.199.111."*) ok=ja ;;
            esac

            if [ "$ok" = "ja" ]; then
              echo "DNS in Ordnung."
              # Der Eintrag ohne www ist kein Abbruchgrund, aber sein Fehlen
              # faellt sonst erst auf, wenn jemand die Adresse ohne www
              # eingibt und im Leeren landet.
              case " $apex_a " in
                *" 185.199.10"*|*" 185.199.11"*) : ;;
                *) echo "HINWEIS: $apex zeigt nicht auf GitHub Pages. Ohne die vier A-Eintraege fuehrt die Adresse ohne www ins Leere." ;;
              esac
              break
            fi

            if [ "$(date +%s)" -ge "$grenze" ]; then
              echo
              echo "ABBRUCH: $DOMAIN zeigt noch nicht auf GitHub Pages."
              echo "Beim Domainanbieter ERSETZEN (siehe Kopf dieser Datei):"
              echo "  $DOMAIN  CNAME  ${{ github.repository_owner }}.github.io"
              echo "  $apex  A  185.199.108.153 / .109.153 / .110.153 / .111.153"
              echo "Dann diesen Workflow erneut starten, gern mit warten=60."
              echo "Die Domain wurde NICHT gesetzt, die Seite bleibt unter github.io erreichbar."
              exit 1
            fi

            echo "Noch nicht umgestellt. Naechste Pruefung in 60 Sekunden."
            sleep 60
          done

      - name: Domain setzen
        run: |
          code=$(curl -sS -o /tmp/antwort.txt -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$API" \
            -d "{\"cname\":\"$DOMAIN\"}")
          echo "HTTP $code"
          cat /tmp/antwort.txt; echo
          # 204 heisst uebernommen. Alles andere faerbt den Lauf rot.
          if [ "$code" != "204" ]; then
            echo "Fehlgeschlagen. Die Domain muss von Hand gesetzt werden:"
            echo "Settings -> Pages -> Custom domain -> $DOMAIN -> Save"
            exit 1
          fi

      - name: HTTPS erzwingen
        if: inputs.https == 'ja'
        run: |
          code=$(curl -sS -o /tmp/antwort.txt -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$API" \
            -d '{"https_enforced":true}')
          echo "HTTP $code"
          cat /tmp/antwort.txt; echo
          if [ "$code" != "204" ]; then
            echo "HTTPS liess sich noch nicht erzwingen. Meist fehlt das Zertifikat noch;"
            echo "in einer Stunde erneut mit https=ja starten. Die Domain selbst ist gesetzt."
            exit 1
          fi

      - name: Stand nachher
        run: |
          echo "--- Pages-Einstellungen nachher ---"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" "$API" \
            | grep -E '"(cname|html_url|status|https_enforced|protected_domain_state)"' || true

      - name: Pages-Deploy neu anstossen
        run: |
          code=$(curl -sS -o /tmp/antwort.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/youman-website-pages.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}")
          echo "HTTP $code"
          cat /tmp/antwort.txt; echo
          if [ "$code" != "204" ]; then
            echo "Der Deploy liess sich nicht anstossen. Von Hand: Actions -> youman Website auf GitHub Pages -> Run workflow."
            exit 1
          fi
          echo "Deploy laeuft. Danach tragen canonical, og:url und Sitemap die Domain."
