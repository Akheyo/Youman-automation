name: Build & Release Windows App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        shell: bash

      - name: Build shared packages
        run: |
          pnpm build:shared
          pnpm build:config-engine
          pnpm build:sap
          pnpm build:plenty
        shell: bash

      # Prisma-Client generieren – ohne ihn wirft schon der Import von
      # PrismaService (extends PrismaClient) und die Backend-Tests scheitern.
      - name: Prisma-Client generieren
        run: pnpm --filter @youman/backend exec prisma generate
        shell: bash

      # Qualitäts-Gate: Bricht ein Nutzerweg (Smoke-Tests) oder der
      # Typecheck, entsteht KEIN Installer.
      - name: Typecheck + alle Tests (inkl. Smoke-Testreihe)
        run: |
          pnpm --filter @youman/desktop typecheck
          pnpm -r test
        shell: bash

      - name: Generate app icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "apps\desktop\assets" | Out-Null
          Add-Type -AssemblyName System.Drawing
          $sizes = @(16, 32, 48, 64, 128, 256)
          $pngs = @()
          foreach ($size in $sizes) {
            $bmp = New-Object System.Drawing.Bitmap($size, $size, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $g.TextRenderingHint = [System.Drawing.Text.TextRenderingHint]::AntiAliasGridFit
            $g.Clear([System.Drawing.Color]::Transparent)
            $radius = [int]($size * 0.16)
            $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 61, 56, 53))
            $path = New-Object System.Drawing.Drawing2D.GraphicsPath
            $d = $radius * 2
            $path.AddArc(0, 0, $d, $d, 180, 90)
            $path.AddArc($size - $d, 0, $d, $d, 270, 90)
            $path.AddArc($size - $d, $size - $d, $d, $d, 0, 90)
            $path.AddArc(0, $size - $d, $d, $d, 90, 90)
            $path.CloseFigure()
            $g.FillPath($brush, $path)
            $fontSize = [float]($size * 0.55)
            $font = New-Object System.Drawing.Font("Arial", $fontSize, [System.Drawing.FontStyle]::Bold)
            $textBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::White)
            $sf = New-Object System.Drawing.StringFormat
            $sf.Alignment = [System.Drawing.StringAlignment]::Center
            $sf.LineAlignment = [System.Drawing.StringAlignment]::Center
            $g.DrawString("&", $font, $textBrush, [System.Drawing.RectangleF]::new(0, 0, $size, $size), $sf)
            $ms = New-Object System.IO.MemoryStream
            $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
            $pngs += ,$ms.ToArray()
            $ms.Dispose(); $g.Dispose(); $bmp.Dispose()
          }
          $ico = New-Object System.IO.MemoryStream
          $w = New-Object System.IO.BinaryWriter($ico)
          $w.Write([int16]0); $w.Write([int16]1); $w.Write([int16]$sizes.Count)
          $offset = 6 + ($sizes.Count * 16)
          for ($i = 0; $i -lt $sizes.Count; $i++) {
            $s = $sizes[$i]; $dim = if ($s -eq 256) { 0 } else { $s }
            $w.Write([byte]$dim); $w.Write([byte]$dim); $w.Write([byte]0); $w.Write([byte]0)
            $w.Write([int16]1); $w.Write([int16]32)
            $w.Write([int32]$pngs[$i].Length); $w.Write([int32]$offset)
            $offset += $pngs[$i].Length
          }
          foreach ($png in $pngs) { $w.Write($png) }
          [System.IO.File]::WriteAllBytes("apps\desktop\assets\icon.ico", $ico.ToArray())
          Write-Host "Icon generated successfully"

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f -w better-sqlite3
        working-directory: apps/desktop
        shell: bash

      - name: Build & publish installer
        run: pnpm --filter @youman/desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ohne diese Variable fällt der Build auf http://localhost:3001
          # zurück – jede Neuinstallation zeigte damit auf den Rechner des
          # Kunden statt auf den Server, und die Adresse musste von Hand
          # eingetragen werden. Über "Server-Einstellungen" bleibt sie
          # weiterhin pro Installation überschreibbar.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://adept-backend-2w20.onrender.com/api/v1' }}
