name: youman Website auf GitHub Pages

# Baut den Ordner youman-website/ und veröffentlicht ihn über GitHub Pages.
#
# Die Adresse ergibt sich aus den Pages-Einstellungen des Repos: mit
# eingetragener eigener Domain läuft die Seite dort, sonst unter
# https://akheyo.github.io/Youman-automation/
#
# Eine eigene Domain steht in den Pages-Einstellungen, nicht in einer Datei
# im Repository. Bei einem Deploy ueber Actions setzt eine CNAME-Datei die
# Domain nicht.
#
# Sobald die Seite ein eigenes Repo hat, greift stattdessen
# youman-website/.github/workflows/deploy.yml und diese Datei kann weg.

on:
  push:
    branches:
      - main
      - claude/new-session-b4oeuo
    paths:
      - 'youman-website/**'
      - '.github/workflows/youman-website-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      adressen: ${{ steps.adressen.outputs.anzahl }}
      schluessel: ${{ steps.schluessel.outputs.wert }}
    defaults:
      run:
        working-directory: youman-website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: youman-website/package-lock.json

      - name: Pages konfigurieren
        id: pages
        # Kein enablement: das Anlegen der Pages-Site per API erfordert
        # Adminrechte, die der Workflow-Token nicht hat. Pages muss einmalig
        # unter Settings, Pages, Source: GitHub Actions eingeschaltet werden.
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          # Kontaktdaten und Formularanbindung kommen aus den Repository-
          # Variablen, damit sie ohne Codeaenderung gesetzt werden koennen:
          # Settings, Secrets and variables, Actions, Variables.
          # Nicht gesetzte Werte sind leer; die Seite weist die Stelle dann
          # sichtbar als Platzhalter aus.
          KONTAKT_EMAIL: ${{ vars.KONTAKT_EMAIL }}
          KONTAKT_TELEFON: ${{ vars.KONTAKT_TELEFON }}
          KONTAKT_TERMINLINK: ${{ vars.KONTAKT_TERMINLINK }}
          FORMULAR_ENDPUNKT: ${{ vars.FORMULAR_ENDPUNKT }}
          # Als Secret, weil der Schluessel im ausgelieferten HTML steht und
          # nicht zusaetzlich in der Protokollausgabe auftauchen soll.
          FORMULAR_SCHLUESSEL: ${{ secrets.FORMULAR_SCHLUESSEL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: youman-website/dist

      - name: Sitemap merken
        id: adressen
        # Die Liste der Adressen aus der Sitemap, fuer die Meldung an
        # IndexNow im letzten Job. Sie entsteht hier, weil weder der
        # Deploy-Job noch der IndexNow-Job den gebauten Ordner hat.
        #
        # Der Pfad ist relativ zu youman-website, nicht zum Repository:
        # Dieser Job hat working-directory auf youman-website gesetzt. Beim
        # ersten Versuch stand hier der Pfad vom Repositorystamm aus, damit
        # suchte der Schritt unter youman-website/youman-website und fand
        # nichts. Er meldete das korrekt als "keine Sitemap" und wurde
        # uebersprungen, ohne den Lauf rot zu faerben.
        run: |
          if [ -f dist/sitemap-0.xml ]; then
            grep -o '<loc>[^<]*</loc>' dist/sitemap-0.xml \
              | sed 's|<loc>||; s|</loc>||' > /tmp/adressen.txt
            echo "anzahl=$(wc -l < /tmp/adressen.txt)" >> "$GITHUB_OUTPUT"
            echo "Adressen fuer IndexNow: $(wc -l < /tmp/adressen.txt)"
            head -3 /tmp/adressen.txt
          else
            echo "anzahl=0" >> "$GITHUB_OUTPUT"
            echo "Keine Sitemap gebaut. Das ist richtig, solange die Seite auf noindex steht."
          fi

      - name: Schluessel merken
        id: schluessel
        # Der IndexNow-Job hat keinen Checkout, deshalb wird der Schluessel
        # hier ausgelesen und als Ausgabe weitergereicht. Er ist kein
        # Geheimnis: Er steht ohnehin oeffentlich unter /<schluessel>.txt,
        # genau das ist der Nachweis.
        run: |
          wert=$(grep -oE "'[A-Za-z0-9-]{8,128}'" src/data/indexnow.ts | tr -d "'" | head -1)
          echo "wert=$wert" >> "$GITHUB_OUTPUT"
          echo "Schluessel: $wert"

      - uses: actions/upload-artifact@v4
        if: steps.adressen.outputs.anzahl != '0'
        with:
          name: adressen
          path: /tmp/adressen.txt
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------
  # IndexNow: meldet die veroeffentlichten Adressen an Bing und die uebrigen
  # teilnehmenden Suchmaschinen, statt auf den naechsten Crawl zu warten.
  #
  # Google nimmt nicht teil, dort bleibt es bei Sitemap und Crawl. Fuer
  # youman zaehlt vor allem Bing, weil Microsoft Copilot seine Antworten aus
  # dem Bing-Index speist.
  #
  # Laeuft nach dem Deploy, nicht davor: Gemeldet werden darf erst, was
  # tatsaechlich abrufbar ist. Eine Meldung auf eine Adresse, die noch 404
  # liefert, wird als Fehler gewertet.
  #
  # continue-on-error: Eine fehlgeschlagene Meldung ist kein Grund, den
  # Deploy rot zu faerben. Die Seite ist dann trotzdem veroeffentlicht.
  # ---------------------------------------------------------------------
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.adressen != '0' && needs.build.outputs.adressen != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SCHLUESSEL: ${{ needs.build.outputs.schluessel }}
    steps:
      - uses: actions/download-artifact@v4
        id: laden
        continue-on-error: true
        with:
          name: adressen
          path: /tmp/adressen

      - name: Adressen melden
        if: steps.laden.outcome == 'success'
        run: |
          datei=/tmp/adressen/adressen.txt
          [ -s "$datei" ] || { echo "Keine Adressen, nichts zu melden."; exit 0; }

          # Der Gastgeber ergibt sich aus der ersten Adresse. So stimmt er
          # automatisch, egal ob die Seite unter der eigenen Domain oder
          # unter github.io liegt.
          erste=$(head -1 "$datei")
          gastgeber=$(echo "$erste" | sed -E 's|^https?://([^/]+).*|\1|')
          schluessel="$SCHLUESSEL"
          [ -n "$schluessel" ] || { echo "Kein Schluessel uebergeben, nichts zu melden."; exit 0; }

          echo "Gastgeber: $gastgeber"
          echo "Adressen:  $(wc -l < "$datei")"

          # Als JSON-Liste in einem Aufruf, nicht einzeln: IndexNow nimmt bis
          # zu 10 000 Adressen auf einmal entgegen, und viele Einzelaufrufe
          # gelten als Missbrauch.
          liste=$(sed 's/.*/"&"/' "$datei" | paste -sd, -)
          koerper="{\"host\":\"$gastgeber\",\"key\":\"$schluessel\",\"keyLocation\":\"https://$gastgeber/$schluessel.txt\",\"urlList\":[$liste]}"

          code=$(curl -sS -o /tmp/antwort.txt -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$koerper" \
            https://api.indexnow.org/IndexNow)

          echo "HTTP $code"
          cat /tmp/antwort.txt 2>/dev/null; echo
          # 200 heisst angenommen, 202 heisst angenommen und wird geprueft.
          case "$code" in
            200|202) echo "Gemeldet." ;;
            422) echo "Abgelehnt: Der Schluessel unter https://$gastgeber/$schluessel.txt passt nicht zur Meldung." ;;
            403) echo "Abgelehnt: Schluesseldatei nicht erreichbar oder Inhalt falsch." ;;
            *) echo "Unerwartete Antwort. Die Seite ist trotzdem veroeffentlicht." ;;
          esac
